id = "heyfirst.worktree-include"
name = "Worktree Include"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "herdr plugin that copies .worktreeinclude files into new worktrees. Built with Bun."
platforms = ["macos", "linux"]

[[events]]
on = "worktree.created"
command = ["bun", "dist/main.js", "event"]

[[actions]]
id = "apply"
title = "Apply worktree include"
contexts = ["workspace"]
command = ["bun", "dist/main.js", "apply"]
