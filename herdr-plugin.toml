id = "heyfirst.worktree-include"
name = "Worktree Include"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Copy .worktreeinclude-matched, gitignored files into new herdr worktrees"
platforms = ["macos", "linux"]

[[events]]
on = "worktree.created"
command = ["bun", "src/main.ts", "event"]

[[actions]]
id = "apply"
title = "Apply worktree include"
contexts = ["workspace"]
command = ["bun", "src/main.ts", "apply"]
